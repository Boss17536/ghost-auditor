<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Ghost Auditor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px; padding-top: 80px;">
        <div class="card">
            <h2 style="margin-bottom: 24px;">Workspace Settings</h2>

            <form action="{{ url_for('user_settings') }}" method="POST">
                <div class="form-group">
                    <label class="form-label">TinyFish API Key</label>
                    <input type="password" name="tinyfish_key" class="form-control" placeholder="Update your key" value="{{ masked_key }}">
                    <span class="form-text">Leave as **** if you don't want to change it.</span>
                </div>

                <div style="height: 1px; background: var(--border); margin: 32px 0;"></div>

                <div class="form-group">
                    <label class="form-label" style="font-size: 0.8rem; margin-top: 16px;">SaaS Platform</label>
                    <select name="tool" class="form-control" style="appearance: auto; margin-bottom: 16px;">
                        <option value="slack" {% if user.tool == 'slack' %}selected{% endif %}>Slack</option>
                        <option value="github" {% if user.tool == 'github' %}selected{% endif %}>GitHub</option>
                        <option value="notion" {% if user.tool == 'notion' %}selected{% endif %}>Notion</option>
                    </select>

                    <label class="form-label" style="font-size: 0.8rem;">Workspace Admin URL</label>
                    <input type="url" name="workspace_url" class="form-control" required value="{{ user.workspace_url }}" style="margin-bottom: 16px;">

                    <label class="form-label" style="font-size: 0.8rem;">Monthly Seat Cost (USD)</label>
                    <input type="number" step="0.01" name="seat_cost" class="form-control" value="{{ user.seat_cost | default(7.00) }}" required>
                </div>
                
                <div style="height: 1px; background: var(--border); margin: 32px 0;"></div>

                <div class="form-group">
                    <label class="form-label">Secure Session Injection</label>
                    <span class="form-text" style="display: block; margin-bottom: 12px; color: var(--text-secondary);">
                        To bypass 2FA, drag this to your bookmarks bar and click it on Slack.<br>
                        <code style="background: rgba(124, 58, 237, 0.2); color: #c4b5fd; padding: 4px; border-radius: 4px; font-size: 0.75rem; user-select: all; display: inline-block; margin-bottom: 8px;">javascript:prompt("Copy your Secure Session Cookies:", document.cookie)</code>
                    </span>
                    <textarea name="slack_cookie" class="form-control" placeholder="Drop your massive raw cookie sequence here... Leave empty to keep existing password / cookie." style="min-height: 80px; resize: vertical;">{{ masked_cookie }}</textarea>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Settings</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
